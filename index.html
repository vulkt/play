<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Gold Timer</title>
<style>
/* Your existing CSS from before */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Helvetica Neue', Arial, sans-serif;
}
body {
    background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #d4af37;
}
.container {
    width: 100%;
    max-width: 500px;
    text-align: center;
}
h1 {
    font-size: 2.2rem;
    margin-bottom: 40px;
    text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    letter-spacing: 1px;
    font-weight: 300;
}
.buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-top: 20px;
}
.btn {
    background: linear-gradient(to bottom, #d4af37, #b8860b);
    color: #000;
    border: none;
    border-radius: 10px;
    padding: 22px 10px;
    font-size: 1.3rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 5px 0 #8b7500, 0 8px 15px rgba(0, 0, 0, 0.6);
    position: relative;
    overflow: hidden;
    letter-spacing: 0.5px;
}
.btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #8b7500, 0 3px 8px rgba(0, 0, 0, 0.6);
}
.btn::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, rgba(255, 255, 255, 0.2), transparent);
    opacity: 0;
    transition: opacity 0.2s;
}
.btn:hover::after {
    opacity: 1;
}
.status {
    margin-top: 35px;
    font-size: 1.3rem;
    height: 40px;
    font-weight: 300;
    display: flex;
    align-items: center;
    justify-content: center;
}
.footer {
    margin-top: 40px;
    font-size: 0.9rem;
    color: #aaa;
    font-weight: 300;
}
@media (max-width: 600px) {
    h1 { font-size: 1.8rem; }
    .buttons { grid-template-columns: repeat(2, 1fr); gap: 15px; }
    .btn { padding: 18px 10px; font-size: 1.2rem; }
    .status { font-size: 1.2rem; }
}
@media (max-width: 400px) {
    .buttons { grid-template-columns: 1fr; }
    .btn { max-width: 280px; margin: 0 auto 15px; }
}
</style>
</head>
<body>
<div class="container">
    <h1>PREMIUM TIMER</h1>
    <div class="status" id="status">Select Duration</div>
    <div class="buttons">
        <button class="btn" data-time="1">1 SEC</button>
        <button class="btn" data-time="3">3 SEC</button>
        <button class="btn" data-time="5">5 SEC</button>
        <button class="btn" data-time="8">8 SEC</button>
        <button class="btn" data-time="10">10 SEC</button>
        <button class="btn" data-time="15">15 SEC</button>
    </div>
    <div class="footer">PREMIUM TIME MANAGEMENT</div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
  // TODO: Replace with your Firebase project config
  const firebaseConfig = {
    apiKey: "AIzaSyCWO7JdAMVsxqUfSZ1Hlwki_Hm7IGJR3rM",
    authDomain: "turntable-df203.firebaseapp.com",
    projectId: "turntable-df203",
    storageBucket: "turntable-df203.firebasestorage.app",
    messagingSenderId: "994359441807",
    appId: "1:994359441807:web:503ffbbc2e0e2a69bdf3fa",
    measurementId: "G-NP50XQJN79"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const docRef = db.collection("turntable_settings").doc("buttons");

  const buttons = document.querySelectorAll(".btn");
  const statusEl = document.getElementById("status");

  buttons.forEach(btn => {
    btn.addEventListener("click", () => {
        const selected = btn.dataset.time;
        statusEl.textContent = `${selected} SEC SELECTED`;

        // Prepare update object: selected true, rest false
        const updateData = {};
        ["1","3","5","8","10","15"].forEach(time => {
            updateData[time] = time === selected;
        });

        // Update Firestore
        docRef.set(updateData)
            .then(() => console.log("Updated buttons:", updateData))
            .catch(err => console.error("Error updating buttons:", err));
    });
  });
</script>
</body>
</html>
