<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Gold Timer</title>
<style>
/* SAME STYLING AS BEFORE — unchanged */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Helvetica Neue', Arial, sans-serif;
}
body {
    background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #d4af37;
}
.container {
    width: 100%;
    max-width: 500px;
    text-align: center;
}
h1 {
    font-size: 2.2rem;
    margin-bottom: 40px;
    text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    letter-spacing: 1px;
    font-weight: 300;
}
.buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-top: 20px;
}
.btn {
    background: linear-gradient(to bottom, #d4af37, #b8860b);
    color: #000;
    border: none;
    border-radius: 10px;
    padding: 22px 10px;
    font-size: 1.2rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 5px 0 #8b7500, 0 8px 15px rgba(0, 0, 0, 0.6);
}
.status {
    margin-top: 35px;
    font-size: 1.3rem;
    height: 40px;
}
</style>
</head>
<body>

<div class="container">
    <h1>PREMIUM TIMER</h1>
    <div class="status" id="status">Select Duration</div>

    <div class="buttons">
        <button class="btn" data-time="0.1">0.1 SEC</button>
        <button class="btn" data-time="0.5">0.5 SEC</button>
        <button class="btn" data-time="1">1 SEC</button>
        <button class="btn" data-time="2">2 SEC</button>
        <button class="btn" data-time="3">3 SEC</button>
        <button class="btn" data-time="5">5 SEC</button>
    </div>

    <div class="footer">PREMIUM TIME MANAGEMENT</div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCWO7JdAMVsxqUfSZ1Hlwki_Hm7IGJR3rM",
    authDomain: "turntable-df203.firebaseapp.com",
    projectId: "turntable-df203",
    storageBucket: "turntable-df203.firebasestorage.app",
    messagingSenderId: "994359441807",
    appId: "1:994359441807:web:503ffbbc2e0e2a69bdf3fa",
    measurementId: "G-NP50XQJN79"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection("turntable_settings").doc("buttons");

const buttons = document.querySelectorAll(".btn");
const statusEl = document.getElementById("status");

const times = ["0.1", "0.5", "1", "2", "3", "5"];

buttons.forEach(btn => {
    btn.addEventListener("click", () => {
        const selected = btn.dataset.time;
        statusEl.textContent = `${selected} SEC SELECTED`;

        // Build object: selected = true, others false
        const updateData = {};
        times.forEach(t => updateData[t] = (t === selected));

        docRef.set(updateData)
            .then(() => console.log("Updated:", updateData))
            .catch(err => console.error(err));
    });
});
</script>

</body>
</html>
